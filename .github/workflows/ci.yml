name: Spring Boot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: gameflix
          MYSQL_USER: gameflix_app
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/gameflix?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: gameflix_app
      SPRING_DATASOURCE_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate temporary JWT secret for tests
        run: echo "APP_JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build and test with Maven
        run: bash ./mvnw --batch-mode clean package

      - name: Build Docker image
        run: docker build -t gameflix-backend .
        